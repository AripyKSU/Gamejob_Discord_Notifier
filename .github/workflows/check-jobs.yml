name: Check GameJob

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. 매일 00:10 UTC = 09:10 KST
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: gamejob-notifier
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check new jobs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Save seen job IDs
        run: |
          if git diff --quiet -- seen_jobs.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "gamejob-notifier[bot]"
          git config user.email "gamejob-notifier[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "chore: update seen GameJob IDs"
          git push
